<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка диагностики по протоколам</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#667085;--bd:#dde1e8;--ok:#117a3d;--okbg:#e6f5ec;--warn:#9a6700;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fde8e6;--acc:#1f5fbf}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e6e9ef;--mut:#98a1b0;--bd:#2f3541;--ok:#5fd18a;--okbg:#17301f;--warn:#e5b94a;--warnbg:#33290f;--bad:#ff8a80;--badbg:#3a1b19;--acc:#7aa7f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}select{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.ex{color:var(--acc);cursor:pointer;font-size:13px;margin-right:12px;text-decoration:underline dotted}
.verdict{padding:10px 12px;border-radius:8px;font-weight:600;margin:8px 0}
.v-ok{background:var(--okbg);color:var(--ok)}.v-warn{background:var(--warnbg);color:var(--warn)}.v-bad{background:var(--badbg);color:var(--bad)}
.meta{color:var(--mut);font-size:13px}.meta b{color:var(--fg)}
blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--bg);white-space:pre-wrap}
.ev{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-left:4px}
a{color:var(--acc)}.hist div{padding:4px 0;cursor:pointer;border-bottom:1px solid var(--bd);font-size:14px}.hist div:hover{color:var(--acc)}
.stars{font-size:30px;line-height:1;margin:6px 0;cursor:pointer;user-select:none}.stars span{color:var(--bd)}.stars span.on{color:#f2b01e}.stars span:hover{color:#f2b01e}
.tag input{vertical-align:middle}label.tag{cursor:pointer}
ul.lst{margin:4px 0 8px;padding-left:22px}ul.lst li{margin:2px 0}ul.lst:empty{display:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
.busy{display:flex;gap:12px;align-items:center;color:var(--mut)}.busy .spin{width:26px;height:26px;border-width:3px;color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
details summary{cursor:pointer;color:var(--mut);font-size:13px}pre{white-space:pre-wrap;font-size:13px}
</style></head><body><div class="wrap">
<h1>Проверка диагностики по клиническим протоколам МЗ РБ <span class="meta" style="font-weight:400">версия __VERSION__</span></h1>
<div class="card">
 <textarea id="q" placeholder="Диагноз – аутоиммунный тиреоидит, разрешён ли анализ мочи по Нечипоренко&#10;или: сахарный диабет, перечень лабораторных анализов"></textarea>
 <div class="row">
  <button id="go">Проверить</button>
  <select id="pop"><option value="">возраст: определить</option><option value="adult">взрослые</option><option value="child">дети</option></select>
  <span id="st" class="meta">Enter — отправить, Shift+Enter — новая строка</span>
 </div>
 <div class="row" id="examples"></div>
</div>
<div id="out"></div>
<div class="card hist" id="hcard" hidden><div class="meta" style="margin-bottom:6px">История запросов <a href="#" id="hclear">очистить</a></div><div id="hist"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EX=["Диагноз – аутоиммунный тиреоидит, разрешён ли анализ мочи по Нечипоренко","Диагноз – болезнь Аддисона, разрешен ли тест с инсулиновой гипогликемией","Диагноз E06.3, ТТГ","Сахарный диабет 2 типа, определение гликированного гемоглобина","Сахарный диабет, перечень лабораторных анализов","Ангиомиолипома, какой вид КТ используется для диагностики"];
$("examples").innerHTML=EX.map((e,i)=>`<span class="ex" data-i="${i}">${esc(e.length>48?e.slice(0,48)+"…":e)}</span>`).join("");
$("examples").onclick=e=>{if(e.target.dataset.i){$("q").value=EX[e.target.dataset.i];ask()}};
const lvl={mandatory:"v-ok",additional:"v-ok",listed:"v-warn",differential:"v-warn",monitoring:"v-warn",text:"v-warn",manual:"v-warn"};
let hist=[];try{hist=JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){}
function saveHist(q){hist=[q,...hist.filter(x=>x!==q)].slice(0,30);try{localStorage.setItem("hist",JSON.stringify(hist))}catch(e){}drawHist()}
function drawHist(){$("hcard").hidden=!hist.length;$("hist").innerHTML=hist.map((h,i)=>`<div data-i="${i}">${esc(h)}</div>`).join("")}
$("hist").onclick=e=>{if(e.target.dataset.i){$("q").value=hist[e.target.dataset.i];ask()}};
$("hclear").onclick=e=>{e.preventDefault();hist=[];try{localStorage.removeItem("hist")}catch(e){}drawHist()};
function renderList(a){
 const d=a.diagnosis||{};
 let h=`<div class="card"><div class="meta"><b>Диагноз:</b> ${esc(d.code||"")} ${esc(d.name||"")} <span class="tag">из «${esc(a.diagnosis_text)}»</span>`;
 (a.diagnosis_alternatives||[]).forEach(x=>h+=`<br>или? ${esc(x.code)} ${esc(x.name)}`);
 h+=`<br><b>Перечень:</b> ${esc(a.category_label)}`+(a.service_text?`, услуга «${esc(a.service_text)}»`:"");
 if(a.population)h+=`<br><b>Население:</b> ${a.population=="child"?"дети":"взрослые"}`;
 h+=`</div>`;
 if(!(a.results||[]).length)h+=`<div class="verdict v-bad">${esc(a.verdict)}</div>`;
 (a.results||[]).forEach(r=>{
  h+=`<div class="verdict v-ok">${esc(r.population.toUpperCase())}: ${esc(r.verdict)}</div>`;
  r.sections.forEach(s=>{
   const w=s.chapter!=null?`Глава ${esc(s.chapter)} «${esc(s.chapter_title)}»`:esc(s.chapter_title||"");
   h+=`<div class="ev"><b>${esc(s.protocol)}</b><div class="meta">${w}`+(s.related?`<span class="tag">смежный раздел — проверьте применимость</span>`:"")+`</div><ul class="lst">`;
   let lv=null;
   s.items.forEach(e=>{
    if(e.level!=lv){lv=e.level;h+=`</ul><div class="meta"><b>${esc(e.level_label)}</b></div><ul class="lst">`}
    const p=e.pdf_pages.length>1?`${e.pdf_pages[0]}–${e.pdf_pages.at(-1)}`:e.pdf_pages[0];
    h+=`<li>${e.condition?`<span class="meta">[${esc(e.condition)}]</span> `:""}${esc(e.text)} <a href="${esc(e.url)}" target="_blank" rel="noopener" class="meta">${e.clause?"п. "+esc(e.clause)+", ":""}стр. ${esc(p)}</a></li>`;
   });
   h+=`</ul></div>`;
  });
 });
 (a.text_only||[]).forEach(t=>h+=`<div class="verdict v-warn">В тексте, не перечнем (проверьте по главе): <a href="${esc(t.url)}" target="_blank">${esc(t.protocol)}, ${t.chapter!=null?"глава "+esc(t.chapter)+" «"+esc(t.chapter_title)+"»":esc(t.chapter_title)}</a></div>`);
 return h;
}
function render(a){
 if(a.error)return `<div class="card"><div class="verdict v-bad">${esc(a.error)}</div></div>`;
 if(a.mode=="list")return renderList(a)+tail(a);
 const d=a.diagnosis||{},svc=a.service_catalogue||[];
 let h=`<div class="card"><div class="meta"><b>Диагноз:</b> ${esc(d.code||"")} ${esc(d.name||"")} <span class="tag">из «${esc(a.diagnosis_text)}»</span>`;
 (a.diagnosis_alternatives||[]).forEach(x=>h+=`<br>или? ${esc(x.code)} ${esc(x.name)}`);
 h+=`<br><b>Услуга:</b> «${esc(a.service_text)}»`+(svc[0]?` → пост. №123: ${esc(svc[0].code)} ${esc(svc[0].name)}`:"");
 svc.slice(1).forEach(x=>h+=`<br>или? ${esc(x.code)} ${esc(x.name)}`);
 if(a.population)h+=`<br><b>Население:</b> ${a.population=="child"?"дети":"взрослые"}`;
 h+=`</div>`;
 if(!(a.results||[]).length)h+=`<div class="verdict v-bad">ВЕРДИКТ: ${esc(a.verdict)}</div>`;
 (a.results||[]).forEach(r=>{
  h+=`<div class="verdict ${lvl[r.verdict_level]||"v-bad"}">${esc(r.population.toUpperCase())}: ${esc(r.verdict)}</div>`;
  r.evidence.forEach((e,i)=>{
   const w=e.chapter!=null?`Глава ${esc(e.chapter)} «${esc(e.chapter_title)}», п. ${esc(e.clause)}`:esc(e.chapter_title||"")+(e.clause?`, п. ${esc(e.clause)}`:"");
   const p=e.pdf_pages.length>1?`${e.pdf_pages[0]}–${e.pdf_pages.at(-1)}`:e.pdf_pages[0];
   const chk={verified:"подтверждено LLM",uncertain:"правила и LLM расходятся — проверьте"}[e.check];
   h+=`<div class="ev"><b>[${i+1}] ${esc(e.protocol)}</b><div class="meta">${w} — ${esc(e.level_label)}`
     +(e.match=="segment"?`<span class="tag">совпадение по строке списка</span>`:"")+(chk?`<span class="tag">${chk}</span>`:"")+`</div>`
     +(e.condition?`<div class="meta">Условие: ${esc(e.condition)}</div>`:"")
     +`<blockquote>${esc(e.quote)}</blockquote><a href="${esc(e.url)}" target="_blank" rel="noopener">Открыть протокол, стр. PDF ${esc(p)}</a>`
     +(e.printed_page?` <span class="meta">(печатная ${esc(e.printed_page)})</span>`:"")+`</div>`;
  });
  if(!r.evidence.length&&(r.checked||[]).length)h+=`<details><summary>Проверенные разделы</summary>`+r.checked.map(c=>`<div class="meta"><a href="${esc(c.url)}" target="_blank">${esc(c.protocol)}</a>: ${esc(c.chapters.join("; "))}</div>`).join("")+`</details>`;
  (r.notes||[]).forEach(n=>h+=`<div class="meta">Оговорка (п. ${esc(n.clause)}): «${esc(n.quote)}» <a href="${esc(n.url)}" target="_blank">ссылка</a></div>`);
 });
 return h+tail(a);
}
function tail(a){
 let h="";
 (a.unparsed||[]).forEach(u=>h+=`<div class="verdict v-warn">Не разобран автоматически (${u.kind=="table"?"таблицы":"скан"}), проверьте вручную: <a href="${esc(u.url)}" target="_blank">${esc(u.protocol)}</a></div>`);
 h+=`<div class="meta">Метод: ${esc(a.method)}.</div>`;
 h+=`<details><summary>Текстовый вид (для копирования)</summary><pre>${esc(a.text)}</pre></details></div>`;
 h+=`<div class="card" id="fb" data-id="${esc(a.answer_id)}"><b>Оцените ответ</b>
  <div class="stars" id="stars">${[1,2,3].map(i=>`<span data-s="${i}" title="${["Плохо","Приемлемо","Хорошо"][i-1]}">★</span>`).join("")}</div>
  <div id="fbmore" hidden>
   <div class="row" id="tags">${["диагноз распознан неверно","услуга распознана неверно","вердикт неверный","цитата не по теме","не нашёл, а в протоколе есть"].map(t=>`<label class="tag"><input type="checkbox" value="${t}"> ${t}</label>`).join("")}</div>
   <textarea id="fbc" style="min-height:50px;margin-top:8px" placeholder="Комментарий (необязательно)"></textarea>
   <div class="row"><button id="fbsend">Отправить оценку</button><span class="meta" id="fbst"></span></div>
  </div></div>`;
 return h;
}
let busy=false;
async function ask(){
 const q=$("q").value.trim();if(!q||busy)return;
 busy=true;$("go").disabled=true;$("go").innerHTML=`<span class="spin"></span> Проверяю…`;
 const t0=Date.now();
 $("out").innerHTML=`<div class="card busy" role="status"><span class="spin"></span><div><b>Ищу в протоколах…</b><div class="meta" id="el">0 с</div></div></div>`;
 const tick=setInterval(()=>{const el=$("el");if(el)el.textContent=Math.round((Date.now()-t0)/1000)+" с"},1000);
 try{
  const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,population:$("pop").value})});
  const a=await r.json();$("out").innerHTML=render(a);if(!a.error)saveHist(q);
 }catch(e){$("out").innerHTML=render({error:String(e)})}
 clearInterval(tick);busy=false;$("go").disabled=false;$("go").textContent="Проверить";
}
let stars=0;
$("out").addEventListener("click",async e=>{
 const s=e.target.dataset&&e.target.dataset.s;
 if(s){stars=+s;[...$("stars").children].forEach((c,i)=>c.classList.toggle("on",i<stars));$("fbmore").hidden=false;return}
 if(e.target.id=="fbsend"){
  const tags=[...document.querySelectorAll("#tags input:checked")].map(x=>x.value);
  try{
   const r=await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer_id:$("fb").dataset.id,stars,tags,comment:$("fbc").value})});
   const j=await r.json();
   if(j.error)throw new Error(j.error);
   $("fb").innerHTML=`<b>Спасибо, оценка ${stars} из 3 сохранена.</b>`;
  }catch(err){$("fbst").textContent="Не удалось отправить: "+err.message}
 }
});
$("go").onclick=ask;
$("q").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask()}});
drawHist();
</script></body></html>
